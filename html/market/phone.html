<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Card Market</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="phone" data-theme="dark">
<div id="app"></div>
<script>
    // sd-phone frames this page; requests go to this resource's NUI callback 'market'
    window.ASC = {
        mode: 'phone',
        call: function (name, args) {
            return fetch('https://as-tradingcards/market', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                body: JSON.stringify({ name: name, args: args || {} }),
            }).then(function (r) { return r.json(); }, function () { throw new Error('No response. Try again.'); })
              .then(function (r) {
                  if (!r || !r.ok) throw new Error((r && r.error) || 'Something went wrong.');
                  return r.data;
              });
        },
    };
    window.addEventListener('message', function (e) {
        var d = e.data;
        if (d && typeof d === 'object' && d.action === 'sd-phone:theme' && d.theme) {
            document.body.setAttribute('data-theme', d.theme);
            document.documentElement.setAttribute('data-theme', d.theme);
        }
    });
    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && window.ASC.refresh) window.ASC.refresh();
    });
</script>
<script src="app.js"></script>
<script>window.ASC.start('/prices');</script>
</body>
</html>
